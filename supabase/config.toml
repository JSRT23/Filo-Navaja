# Configuración de Supabase CLI para desarrollo local.
# Documentación: https://supabase.com/docs/guides/local-development/cli/config
project_id = "barberia-filo-navaja"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# 01_catalogo.sql (sedes, servicios, productos) + 02_demo.sql (usuarios y movimientos de prueba)
sql_paths = ["./seeds/*.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
# Bandeja de correo local para ver los correos de Auth: http://localhost:54324
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m0s"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Solo un admin autenticado puede crear personal
[functions.admin-create-staff]
verify_jwt = true

# La invoca pg_cron con un secreto propio (CRON_SECRET), no con un JWT
[functions.process-email-outbox]
verify_jwt = false

# El cliente autenticado elimina su propia cuenta
[functions.delete-my-account]
verify_jwt = true
